<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>

    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body class="goal-flow post-flow">
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- navbar is different from component and adjusted for this page-->
    <header class="goals-header compact-header" data-bs-theme="dark">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="social.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="31"
              height="31"
              fill="currentColor"
              class="bi bi-arrow-left-circle"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z"
              />
            </svg>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav" style="text-align: center">
              <hr />
              <li class="nav-item">
                <a class="nav-link active" href="#">Profile</a>
              </li>
              <hr />

              <li class="nav-item">
                <a class="nav-link active" href="achievements.html"
                  >Achievements</a
                >
              </li>
              <hr />

              <li class="nav-item">
                <a class="nav-link active" href="#">Settings</a>
              </li>
              <hr />

              <li class="nav-item">
                <a class="nav-link active" href="#">Help</a>
              </li>
              <hr />
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main content goes here -->
    <!-- card for js to fill if the user selected an already made goal, if not, left as is -->
    <h1>Create a Post</h1>
    <div>
      <section class="outdent-card-style-for-adding-goal post-form">
        <label for="imageUpload" class="form-label fw-semibold">Photo</label>
        <label for="imageUpload"
          ><img
            id="placeHolderImage"
            src="/images/grey.png"
            class="card-img-top"
            alt="..."
        /></label>
        <input
          type="file"
          id="imageUpload"
          name="profile_pic"
          class="form-control mb-3"
          accept="image/*"
        />
        <div class="mb-4">
          <label for="goalNameInput" class="form-label fw-semibold"
            >Title</label
          >
          <input
            type="text"
            id="goalNameInput"
            class="form-control mb-3"
            placeholder="Enter goal name"
          />
          <label for="goalPostDescription" class="form-label fw-semibold"
            >Description</label
          >
          <textarea
            id="goalPostDescription"
            class="form-control"
            rows="3"
            placeholder="Enter goal description here"
          ></textarea>
        </div>
        <button
          id="continueDetailsButton"
          type="button"
          class="btn btn-primary w-100"
        >
          Continue
        </button>
      </section>
    </div>

    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->
    <script type="module" src="/src/goal-post-info.js"></script>
  </body>
</html>
