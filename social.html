                    <li class="nav-item">
                        <a class="nav-link active" href="#">Achievements</a>

    <!-- Main content goes here -->
    <div class="card" style="max-height: 320px">
        <div class="d-flex profile-summary" style="align-items: center">
            <img class="rounded-circle profile-image p-1" src="/images/grey.png" alt="Hike Image"
                style="max-height: 80px">
            <h1 class="profile-summary-name"><span id="name-goes-here">User</span></h1>
        </div>
        <div>
            <button type="button" class="btn btn-outline-primary" id="edit-profile"><a href="personal-posts.html">
                    View your posts: <span id="user's-posts">0</span></a></button>
        </div>
        <button type="button" class="btn btn-outline-primary" id="make-post"><a href="select-goal-to-post.html">Post
                Goal</a></button>
    </div>

    <div class="container-fluid bg-body text-dark p-5">
        <h1>What's the community up to these days?</h1>
        <div id="goal-posts-go-here" class="row">
        </div>
    </div>


    <template id="goal-card-template" style="width: 100%">
        <div class="col-12">
            <div class="card">
                <img class="card-img-top card-image" src="..." alt="Goal Image"
                    style="max-height: 320px; min-height: 300px;">
                <i class="bi bi-heart text-danger fs-4 position-absolute top-0 end-0 m-2 fav-btn" role="button"
                    title="Favourite"></i>
                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p>Created by <span class="card-user-id"></span></p>
                    <p class="card-text"></p>
                    <a class="comment" href="main.html" style="text-decoration: none; color: black;">
                        <div style="display: flex; gap: 5px; margin-bottom: 0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
