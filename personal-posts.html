<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Other libraries go here -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
    <link href="styles/style.css" rel="stylesheet" type="text/css">
</head>

<body class="personal-posts-html social-html">

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <header class="goals-header compact-header" data-bs-theme="dark">
        <site-navbar></site-navbar>
    </header>

    <!-- Main content goes here -->
    <div class="card social-profile-card" style="max-height: 320px">
        <br>
        <div class="d-flex profile-summary d-flex flex-column align-items-center">
            <img class="rounded-circle profile-image p-1" src="/images/grey.png" alt="Hike Image"
                style="max-height: 80px">
            <h1 class="profile-summary-name "><span id="name-goes-here">User</span>'s goal
                posts</h1>
        </div>
        <div>
            <a class="btn btn-outline-primary" role="button" href="social.html">Return to community</a>
        </div>

        <br>
        <a class="btn btn-outline-primary" id="make-post" role="button" href="select-goal-to-post.html">Post Goal</a>
    </div>

    <div class="bg-body text-dark p-5 social-div-styling">
        <h1>What have you been up to?</h1>
    </div>
    <div id="goal-posts-go-here"></div>

    <!-- template for posts to fill -->
    <template id="goal-card-template">
        <div class="col-12">
            <div class="card mx-auto" style="max-width: 500px">
                <img class="card-img-top card-image" src="..." alt="Goal Image"
                    style="max-height: 320px; min-height: 300px;">
                <i class="bi bi-trash-fill fs-4 position-absolute top-0 start-0 m-2 remove-post" role="button"
                    title="remove" style="color: white;"></i>
                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p>Created by <span class="card-user-id"></span></p>
                    <p class="card-text"></p>
                    <a class="comment" href="main.html" style="text-decoration: none; color: black;">
                        <div style="display: flex; gap: 5px; margin-bottom: 0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="bi bi-chat-dots-fill" viewBox="0 0 16 16">
                                <path
                                    d="M16 8c0 3.866-3.582 7-8 7a9 9 0 0 1-2.347-.306c-.584.296-1.925.864-4.181 1.234-.2.032-.352-.176-.273-.362.354-.836.674-1.95.77-2.966C.744 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7M5 8a1 1 0 1 0-2 0 1 1 0 0 0 2 0m4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0m3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2" />
                            </svg>
                            <p class="comment-count">0</p>
                            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="currentColor"
                                class="bi bi-heart-fill" viewBox="0 0 16 16" style="transform: translateY(1.5px);">
                                <path fill-rule="evenodd"
                                    d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314" />
                            </svg>
                            <p class="like-count">0</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </template>


    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="src/personal-posts.js"></script>
    <!-- Firebase and authentication related scripts -->
    <!-- The order of loading matters -->
    <script type="module" src="/src/firebaseConfig.js"></script>
    <script type="module" src="/src/authentication.js"></script>
    <script type="module" src="/src/loginSignup.js"></script>
    <!-- functionality goes at the bottom -->
</body>

</html>
