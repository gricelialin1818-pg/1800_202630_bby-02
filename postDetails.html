<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>

    <!-- Main content goes here -->

    <div class="d-flex justify-content-center align-items-center p-2">
        <!-- could try making this min-width; ask group -->
        <section class="card p-4" style="max-width: 300px;">
            <label for="imageUpload"><img id="placeHolderImage" src="/images/grey.png" class="card-img-top"
                    alt="..."></label>
            <input type="file" id="imageUpload" name="profile_pic" class="hidden-upload" accept="image/*">
            <div class="card-body">
                <input type="text" id="goalNameInput" placeholder="Enter goal name" style="border: none; width: 100%">
                <textarea id="goalPostDescription" placeholder="Enter goal description here"
                    style="border: none; width: 100%"></textarea>
            </div>
            <button id="continueDetailsButton" type="button" class="btn btn-outline-primary"
                style="width:100%">Continue</button>

        </section>
    </div>

    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/goalPostInfo.js"></script>

</body>

</html>
