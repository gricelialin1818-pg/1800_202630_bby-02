<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <site-navbar></site-navbar>

    <main class="container py-4 flex-grow-1" style="max-width: 700px">
      <h1 class="display-5 fw-bold mb-2">Goal Steps</h1>
      <p class="text-muted">
        Add steps in the order you want to complete them.
      </p>

      <div id="steps-container" class="mb-3">
        <div class="goal-step-entry mb-3">
          <label for="goal-step-1" class="form-label">Step 1</label>
          <div class="input-group">
            <input
              type="text"
              class="form-control goal-step-input"
              id="goal-step-1"
              placeholder="e.g., Run for 20 minutes..."
            />
            <button
              class="btn btn-outline-secondary remove-step"
              type="button"
              aria-label="Remove step 1"
            >
              Remove
            </button>
          </div>
        </div>
      </div>

      <div class="d-grid gap-2">
        <button
          id="add-step-button"
          class="btn btn-outline-primary"
          type="button"
        >
          Add Step
        </button>
        <button id="save-goal-steps" class="btn btn-primary" type="button">
          Continue
        </button>
      </div>
    </main>

    <site-footer></site-footer>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/add-goal-details.js"></script>
  </body>
</html>
