<!doctype html>
<html lang="en">

<head>
  <title>GoalGetter</title>
  <meta name="Goal App" content="Our Goal App" />

  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Other libraries go here -->
  <script type="module" src="/src/components/site-navbar.js"></script>
  <script type="module" src="/src/components/site-footer.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Adding a hamburger -->
  <site-navbar></site-navbar>

  <!-- Set deadline -->
  <div class="container-fluid d-flex flex-column flex-grow-1 py-3">
    <h1>Deadline Saved!</h1>

    <!-- goal placeholder -->
    <div class="card" aria-hidden="true">
      <svg aria-label="Placeholder" class="bd-placeholder-img card-img-top" height="180"
        preserveAspectRatio="xMidYMid slice" role="img" width="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Placeholder</title>
        <rect width="100%" height="100%" fill="#868e96"></rect>
      </svg>
      <div class="card-body">
        <h5 class="card-title placeholder-glow">
          <span class="placeholder col-6"></span>
        </h5>
        <p class="card-text placeholder-glow">
          <span class="placeholder col-7"></span>
          <span class="placeholder col-4"></span>
          <span class="placeholder col-4"></span>
          <span class="placeholder col-6"></span>
          <span class="placeholder col-8"></span>
        </p>
      </div>
    </div>

    <!-- back button -->
    <div id="back-to-goal" class="d-grid gap-2 mt-auto pt-3">
      <button class="btn btn-primary" type="button">Back to Goal</button>
    </div>
  </div>

  <!--Sticky bottom navbar: class is sticky-bottom-->
  <site-footer></site-footer>

  <!---------------------------------------------->
  <!-- Your own JavaScript functions go here    -->
  <!---------------------------------------------->

  <!-- Link to scripts of your own -->
  <script type="module" src="./src/main.js"></script>
  <script type="styles" src="styles\style.css"></script>
</body>

</html>
